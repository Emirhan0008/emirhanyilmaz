        <header>
          <h1>Emirhan Yılmaz | Psikolojik Danışman &amp; AI, Python, 3D Web Geliştirici</h1>
          <p><strong>Aksaray Üniversitesi Rehberlik ve Psikolojik Danışmanlık (PDR)</strong> mezunuyum. İnsan psikolojisi ve 3 yıllık özel eğitim saha tecrübemi; modern yapay zeka (Google Gemini Vision API, LLM Entegrasyonu), Python otomasyonları, Three.js 3D web grafikleri ve modern web/mobil yazılımlarla harmanlıyorum.</p>
        </header>
        
        <section>
          <h2>Temel Uzmanlık Alanları</h2>
          <ul>
            <li><strong>Yapay Zeka (AI):</strong> Google Gemini API, Multimodal Vision, LLM Prompt Mühendisliği &amp; Pedagojik Geri Bildirim Sistemleri</li>
            <li><strong>Python:</strong> Asyncio, Playwright &amp; Patchright ile Anti-Bot Atlatma Otomasyonları, FastAPI, Bleak Bluetooth LE Telemetri</li>
            <li><strong>3D &amp; Web Grafikleri:</strong> Three.js, WebGL, GLSL Fragment Shaders (Simplex Noise, FBM)</li>
            <li><strong>Modern Web &amp; Mobil:</strong> React 19, TypeScript, Next.js, React Native / Expo, Android Jetpack Compose &amp; Kotlin</li>
            <li><strong>Veritabanı:</strong> Supabase (PostgreSQL, Row Level Security - RLS), Firebase (Firestore, Auth, RTDB)</li>
            <li><strong>Pedagoji &amp; Özel Eğitim:</strong> Bireyselleştirilmiş Eğitim Planı (BEP) Tasarımı, Otizm ve Zihinsel Engellilerde AAC Alternatif İletişim</li>
          </ul>
        </section>

        <section>
          <h2>Öne Çıkan Projeler</h2>
          <ul>
            <li><strong>3D Coğrafya:</strong> Three.js ve WebGL ile geliştirilmiş interaktif 3D dünya küresi ve Türkiye coğrafi keşif simülasyonu. (<a href="https://3d-cografya.vercel.app" style="color: #34d399;">3d-cografya.vercel.app</a>)</li>
            <li><strong>Herkesİşte:</strong> Özel gereksinimli bireylerin istihdamı için aday, işveren ve iş koçlarını buluşturan Supabase PostgreSQL SQL puanlama motorlu kariyer platformu.</li>
